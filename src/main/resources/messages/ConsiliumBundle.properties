error.worktree.no.commits=The repository {0} has no commits yet, so there is nothing to start a parallel branch from. Make the first commit and try again.
error.worktree.inside.repository=The worktree folder {0} is inside the repository {1}; it must be outside, or the repository would see it as untracked files
error.worktree.no.name=Couldn''t find a free branch and folder name for {0}: remove old consilium/* branches and try again
target.auto=Auto: just write
notice.unclear=Should the agents start working, or are we still discussing? Say "go ahead" (or who should do it) to start, or keep the conversation going.
notice.parallel.no.git=Working in parallel needs a git repository: each agent works on its own branch. Ask one agent to do it instead, for example "Claude, do it".
notice.parallel.failed=Couldn''t prepare separate copies for the agents: {0}
notice.parallel.dirty=Uncommitted changes in the project are not in the agents' copies: both start from the last commit.
notice.parallel.started=Claude and Codex are working in parallel, each in its own copy: Claude on {0}, Codex on {1}. {2} will merge both parts when they''re done.
notice.parallel.incomplete=Not every part was finished. The work stays on its branches: {0}. Say "merge" to merge what''s there, or keep discussing.
notice.parallel.no.commits={0} committed nothing, so nothing was merged. The work stays on its branches: {1}. Say "merge" when it''s ready.
notice.merge.started={0} is merging {1} into the project.
notice.merge.failed=The merge didn''t finish. The work stays on its branches: {0}. Say "merge" to try again.
notice.merge.cleaned=Both parts are merged; the agents' copies are removed.
notice.merge.kept=Kept on their branches: {0}: there are changes that aren''t merged.
prompt.part=You are taking part in Consilium, a private working chat with the user and a second coding agent.\nThe user told both agents to go ahead with the work you discussed. You and {0} now work at the same time, each in a separate git worktree of the repository on its own branch; you are on branch {1}, in your working directory.\nDo only your part of the split agreed in the transcript below and don''t touch the other agent''s part. If the transcript has no clear split, don''t change anything: say so and propose one.\nWhen your part is done, run the relevant checks and report briefly what you changed. Don''t commit, merge, push or switch branches: Consilium commits your work on your branch, and {2} merges both branches afterwards.\nReply in the language the user writes in.\n\n
prompt.merge=You are taking part in Consilium, a private working chat with the user and a second coding agent.\nBoth agents have just done their parts of the task in parallel, each on its own branch ({0}). Consilium committed each part with a placeholder message.\nMerge these branches into the project''s current branch, so that the history reads as ordinary work: well-described commits that follow the repository''s conventions (for example, one commit per part). Resolve conflicts so that both parts keep working, run the project''s checks, fix what the merge broke, and report briefly what you merged and what you checked. Don''t push.\nNever stash, commit or discard changes in the project that you didn''t make; if you find any, stop and report.\nThe transcript below shows what was agreed.\nReply in the language the user writes in.\n\n
notice.pending=Unmerged parts from an earlier parallel task are still on their branches: {0}. Say \"merge\" to merge them; a new parallel task can start after that.
notice.merge.dirty=The project has uncommitted changes, so nothing was merged: the merge mustn''t touch them. Commit or stash them, then say \"merge\". The work stays on its branches: {0}.
notice.merge.nothing=There''s nothing left to merge: the branches of the parallel task are gone.
