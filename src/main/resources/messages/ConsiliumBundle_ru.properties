notice.unclear=Начинать работу или ещё обсуждаем? Напишите «делайте» (или кто именно делает), чтобы начать, или продолжайте разговор.
notice.parallel.no.git=Для параллельной работы нужен git-репозиторий: каждый агент работает в своей ветке. Попросите сделать одного, например: «Claude, сделай».
notice.parallel.failed=Не получилось подготовить агентам отдельные копии: {0}
notice.parallel.dirty=Незакоммиченных правок проекта в копиях агентов нет: оба начинают с последнего коммита.
notice.parallel.started=Claude и Codex работают параллельно, каждый в своей копии: Claude в {0}, Codex в {1}. Когда закончат, {2} сведёт обе части.
notice.parallel.incomplete=Не все части доделаны. Работа осталась в ветках: {0}. Напишите «сведите», чтобы свести что есть, или продолжайте обсуждение.
notice.parallel.no.commits={0} ничего не закоммитил, поэтому сведения не было. Работа осталась в ветках: {1}. Напишите «сведите», когда будет готово.
notice.merge.started={0} сводит {1} в проект.
notice.merge.failed=Сведение не закончилось. Работа осталась в ветках: {0}. Напишите «сведите», чтобы попробовать снова.
notice.merge.cleaned=Обе части сведены, копии агентов убраны.
notice.merge.kept=Оставлены в своих ветках: {0}: там есть несведённые правки.
prompt.part=Ты участвуешь в личном рабочем чате Consilium вместе с пользователем и вторым coding-агентом.\nПользователь сказал обоим агентам делать то, что вы обсудили. Ты и {0} работаете одновременно, каждый в отдельном git worktree репозитория и в своей ветке; ты в ветке {1}, в своей рабочей папке.\nДелай только свою часть из договорённости в транскрипте ниже и не трогай часть второго агента. Если в транскрипте нет ясного разделения, ничего не меняй: скажи об этом и предложи разделение.\nКогда твоя часть готова, прогони нужные проверки и кратко отчитайся, что изменил. Не коммить, не сливай, не пушь и не переключай ветки: Consilium сам закоммитит твою работу в твоей ветке, а обе ветки потом сведёт {2}.\nОтвечай на языке, на котором пишет пользователь.\n\n
prompt.merge=Ты участвуешь в личном рабочем чате Consilium вместе с пользователем и вторым coding-агентом.\nОба агента только что параллельно сделали свои части задачи, каждый в своей ветке ({0}). Consilium закоммитил каждую часть с временным сообщением.\nСлей эти ветки в текущую ветку проекта так, чтобы история читалась как обычная работа: понятные коммиты по правилам репозитория (например, по одному на часть). Разреши конфликты так, чтобы обе части работали, прогони проверки проекта, почини то, что сломало слияние, и кратко отчитайся, что свёл и что проверил. Не пушь.\nНикогда не прячь в stash, не коммить и не выбрасывай чужие правки в проекте; если найдёшь такие, остановись и сообщи.\nТранскрипт ниже показывает, о чём договорились.\nОтвечай на языке, на котором пишет пользователь.\n\n
notice.pending=Несведённые части прошлой параллельной задачи ещё лежат в ветках: {0}. Напишите «сведите», чтобы свести их; новая параллельная задача начнётся после этого.
notice.merge.dirty=В проекте есть незакоммиченные правки, поэтому сведения не было: сведение не должно их трогать. Закоммитьте или уберите их и напишите «сведите». Работа осталась в ветках: {0}.
notice.merge.nothing=Сводить нечего: в ветках параллельной задачи нет работы, или их уже нет.
notice.merge.hooks=Обе части готовы, но пока не сведены: {0} меняет настройки git-хуков, а при сведении эти хуки выполнятся в проекте без песочницы. Посмотрите изменения и напишите «сведите».
