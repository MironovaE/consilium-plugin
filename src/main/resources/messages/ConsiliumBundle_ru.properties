error.worktree.inside.repository=Папка для рабочей копии {0} лежит внутри репозитория {1}; она должна быть снаружи, иначе репозиторий увидит её как неотслеживаемые файлы
error.worktree.no.name=Не нашлось свободного имени ветки и папки для {0}: удалите старые ветки consilium/* и попробуйте снова
